<!DOCTYPE html>
<html lang="en">
<head>
    <title>Let's go Gamb... Gaming</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Arial Black', sans-serif; }
        .comic-frame {
            border: 4px solid #fff;
            box-shadow: 8px 8px 0px #fff;
            padding: 40px;
            background: #1e1e1e;
            margin-top: 50px;
        }
        .nav-comic {
            border-bottom: 4px solid #fff;
            padding: 10px;
            background: #1e1e1e;
        }
        .btn-comic {
            border: 3px solid #fff;
            box-shadow: 4px 4px 0px #fff;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<nav class="nav-comic d-flex justify-content-center gap-3">
    <a href="{{ url_for('home') }}" class="btn btn-outline-light btn-comic">HOME</a>
    <a href="{{ url_for('store_front') }}" class="btn btn-outline-light btn-comic">STORE</a>
    <a href="{{ url_for('library') }}" class="btn btn-outline-light btn-comic">LIBRARY</a>
</nav>
<div class="container d-flex justify-content-center">
    <div class="comic-frame text-center">
        <h1 class="text-warning display-3">SUCCESS!</h1>
        <p class="fs-4"> You've got yourself <strong>{{ game.title }}</strong> </p>
        <p class="text-light">In 10 seconds you'll automatically get to you library </p>
        <div class="p-3 my-3 text-start mx-auto" style="max-width: 480px; background: #ffe14d; color: #000; border: 3px solid #000; box-shadow: 4px 4px 0 #fff;">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-collection-fill fs-2"></i>
                <div>
                    <strong class="d-block" style="font-size: 1.15rem;">[POW! LOOT DROP UNLOCKED]</strong>
                    <span style="font-size: 0.9rem;">A random comic collectible card dropped into your binder from this purchase!</span>
                </div>
            </div>
            <div class="text-end mt-2">
                <a href="{{ url_for('inventory.index') }}" class="btn btn-dark btn-sm fw-bold">OPEN INVENTORY &rarr;</a>
            </div>
        </div>

        <div class="mt-4">
        <a href="{{ url_for('library') }}" class="btn btn-success btn-comic btn-lg">TO LIBRARY</a>
        <a href="{{ url_for('inventory.index') }}" class="btn btn-warning btn-comic btn-lg text-dark ms-2">INVENTORY</a>
        </div>
    </div>
</div>

<script>
    setTimeout(function (){
        window.location.href = "{{ url_for('library') }}"
    }, 10000);
</script>
<script>window.squshCartToken = "{{ cart_token }}";</script>
</body>
</html>
