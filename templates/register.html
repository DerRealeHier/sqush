<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sqush Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <style>
        :root{
            --ink:#0d0d0d;
            --paper:#161616;
            --yellow:#ffe14d;
            --red:#ff3b30;
            --blue:#3aa0ff;
            --green:#33d17a;
        }

        body {
            background-color: var(--ink);
            background-image: radial-gradient(rgba(255,255,255,0.06) 1.5px, transparent 1.5px);
            background-size: 14px 14px;
            color: #fff;
            font-family: 'Comic Neue', sans-serif;
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
        }

        h2, h5, .comic-font { font-family: 'Bangers', 'Comic Neue', sans-serif; letter-spacing: 1px; }

        .auth-card {
            width: 100%; max-width: 440px;
            background-color: var(--paper);
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1.5px, transparent 1.5px);
            background-size: 12px 12px;
            padding: 42px 38px;
            border: 4px solid #fff;
            outline: 3px solid #000;
            box-shadow: 12px 12px 0px #000, 16px 16px 0px var(--blue);
            position: relative;
            margin: 40px 0;
        }

        .auth-card::before {
            content: "★ NEW HERO ORIGIN ★";
            position: absolute; top: -18px; left: 24px;
            font-family: 'Bangers', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            color: #000;
            padding: 2px 12px;
            background: var(--blue);
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            transform: rotate(-2deg);
        }

        h2 { color: var(--yellow); font-size: 3.2rem; -webkit-text-stroke: 2px #000; text-shadow: 4px 4px 0 #000, 6px 6px 0 var(--red); }
        h5 { color: #fff; font-size: 1.4rem; letter-spacing: 1.5px; text-shadow: 2px 2px 0 #000; }

        label { color: #bbb; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .form-control, .form-select {
            border: 3px solid #000 !important;
            border-radius: 0 !important;
            background: #222 !important;
            color: #fff !important;
            font-weight: 700;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--yellow) !important;
            box-shadow: 3px 3px 0px var(--yellow) !important;
        }

        .btn-comic-auth {
            background: var(--green);
            border: 4px solid #000;
            color: #000;
            font-family: 'Bangers', sans-serif;
            letter-spacing: 1px;
            font-size: 1.4rem;
            border-radius: 0;
            box-shadow: 6px 6px 0px #000;
            transition: transform 0.1s ease;
        }
        .btn-comic-auth:hover { background: var(--green); color: #000; transform: translate(2px, 2px); box-shadow: 4px 4px 0px #000; }

        .auth-switch-link { color: var(--blue); font-weight: 700; text-decoration: none; }
        .auth-switch-link:hover { color: var(--yellow); }

        .flash-box {
            border: 3px solid #000;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .flash-error { background: var(--red); color: #fff; }
        .flash-success { background: var(--green); color: #000; }
        .flash-info { background: var(--blue); color: #000; }

        .email-confirm-toggle {
            border: 3px solid #000;
            background: #222;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .email-confirm-toggle input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: var(--green); flex-shrink: 0;
        }
        .email-confirm-toggle label {
            color: #ddd; font-size: 0.8rem; text-transform: none; font-weight: 700; margin: 0;
        }
        .email-confirm-toggle small { display:block; color:#888; font-weight:400; text-transform:none; }
    </style>
</head>
<body>
<div class="auth-card">
    <h2 class="text-center mb-4">SQUSH</h2>
    <h5 class="text-center mb-4">Register</h5>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash-box flash-{{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="/register">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">E-Mail Address</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Account Type</label>
            <select name="role" class="form-select">
                <option value="user">Gamer (Buy games &amp; download them)</option>
                <option value="dev">Developer (Publish games)</option>
            </select>
        </div>
        <div class="mb-4 email-confirm-toggle">
            <input type="checkbox" id="email_confirmation" name="email_confirmation" checked>
            <label for="email_confirmation">
                Activate Email Confirmation
                <small>Send a confirmation link. For quick testing, you can tick this off. (But please don't) Firebase is used for this</small>
            </label>
        </div>
        <button type="submit" class="btn btn-comic-auth w-100 py-2 mb-3">Registrieren</button>
        <div class="text-center">
            <small class="text-light">already registered? <a href="/login" class="auth-switch-link">Log in here</a></small>
        </div>
    </form>
</div>

<script>window.squshCartToken = "{{ cart_token }}";</script>
</body>
</html>
